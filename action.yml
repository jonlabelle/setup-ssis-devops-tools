name: Setup SSIS DevOps tools
description: Setup standalone SQL Server Integration Services (SSIS) DevOps tools
author: Jon LaBelle
branding:
  icon: database
  color: yellow

outputs:
  ssis_tools_path:
    description: Path where SSISBuild.exe and SSISDeploy.exe are installed
    value: ${{ steps.paths.outputs.ssis_tools_path }}

runs:
  using: composite
  steps:
    - name: Ensure Windows runner
      if: ${{ runner.os != 'Windows' }}
      shell: sh
      run: |
        echo "::error title=✘ Unsupported runner::A Windows runner is required, e.g. windows-latest"
        exit 1

    - name: Prepare SSIS tools paths
      shell: pwsh
      id: paths
      run: |
        $ErrorActionPreference = 'Stop'

        $rootPath = Join-Path -Path '${{ runner.temp }}' -ChildPath 'setup-ssis-devops-tools'
        $toolsPath = Join-Path -Path $rootPath -ChildPath 'ssis-tools'
        $installerPath = Join-Path -Path $rootPath -ChildPath 'SSISDevOpsTools.exe'

        if (Test-Path -LiteralPath $rootPath) {
          Remove-Item -LiteralPath $rootPath -Recurse -Force -ErrorAction Stop
        }

        New-Item -Path $toolsPath -ItemType Directory -Force -ErrorAction Stop | Out-Null

        [System.IO.File]::AppendAllText(
          $env:GITHUB_OUTPUT,
          "ssis_tools_path=$toolsPath$([Environment]::NewLine)",
          [System.Text.UTF8Encoding]::new($false)
        )

        [System.IO.File]::AppendAllText(
          $env:GITHUB_OUTPUT,
          "installer_path=$installerPath$([Environment]::NewLine)",
          [System.Text.UTF8Encoding]::new($false)
        )

    - name: Download SSISDevOpsTools.exe
      shell: pwsh
      run: |
        $installerUri = 'https://download.microsoft.com/download/5/1/4/5144b772-d3b0-4e1c-a05b-5376f2ea0fc1/SSISDevOpsTools-1.0.0.0.exe'
        $expectedHash = '5B721116D982457EF2FB8C584EF8AE24B7266E519FD5F16CAA867FA32EBDD14F'
        $installerPath = '${{ steps.paths.outputs.installer_path }}'

        Invoke-WebRequest -Uri $installerUri -OutFile $installerPath -ErrorAction 'Stop'

        $actualHash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256 -ErrorAction 'Stop').Hash
        if ($actualHash -cne $expectedHash) {
          Remove-Item -LiteralPath $installerPath -Force -ErrorAction 'SilentlyContinue'
          Write-Error "Downloaded SSISDevOpsTools.exe failed SHA-256 validation. Expected '$expectedHash', received '$actualHash'."
          exit 1
        }

    - name: Extract SSISDevOpsTools.exe
      shell: pwsh
      run: |
        $toolsPath = '${{ steps.paths.outputs.ssis_tools_path }}'
        $installerPath = '${{ steps.paths.outputs.installer_path }}'
        $extractArguments = '/Q', '/C', "/T:`"$toolsPath`""

        $process = Start-Process -FilePath $installerPath -ArgumentList $extractArguments -Wait -PassThru -NoNewWindow
        if ($process.ExitCode -ne 0) { exit $process.ExitCode }

    - name: Verify SSIS tools installation
      shell: pwsh
      run: |
        $toolsPath = '${{ steps.paths.outputs.ssis_tools_path }}'
        $timeout = (Get-Date).AddSeconds(60)

        do
        {
          $missingFiles = @(
            foreach ($expectedFile in 'SSISBuild.exe', 'SSISDeploy.exe')
            {
              $expectedPath = Join-Path -Path $toolsPath -ChildPath $expectedFile
              if (-not (Test-Path -LiteralPath $expectedPath))
              {
                $expectedFile
              }
            }
          )

          if ($missingFiles.Count -eq 0) { break }

          Start-Sleep -Milliseconds 500
        } while ((Get-Date) -lt $timeout)

        if ($missingFiles.Count -gt 0)
        {
          Get-ChildItem -LiteralPath $toolsPath | Format-Table -AutoSize
          Write-Error "Failed to find expected SSIS tools in '$toolsPath': $($missingFiles -join ', ')"
          exit 1
        }

    - name: Add SSIS tools path to job PATH
      shell: pwsh
      run: |
        [System.IO.File]::AppendAllText(
          $env:GITHUB_PATH,
          "${{ steps.paths.outputs.ssis_tools_path }}$([Environment]::NewLine)",
          [System.Text.UTF8Encoding]::new($false)
        )
