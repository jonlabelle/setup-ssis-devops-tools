# Re-tags the latest release with its moving major tag (e.g. v1.2.0 -> v1).
# Triggers: after a release is published, or via manual dispatch.

name: Update major tag

on:
  release:
    types:
      - published

  workflow_dispatch:
    inputs:
      target:
        description: |
          The tag, ref, or latest full version to use. Example: v1.2.1
        required: true
      version:
        description: |
          The major tag to update. Example: v1
        required: true

env:
  TARGET: ${{ github.event.inputs.target || github.event.release.tag_name }}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-major-tag:
    name: Update major tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate inputs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          MAJOR_VER: ${{ github.event.inputs.version }}
        run: |
          if ! git rev-parse --verify "${TARGET}^{}" >/dev/null 2>&1; then
            echo "::error title=Invalid target::Target ref '${TARGET}' does not exist in the repository"
            exit 1
          fi

          if [[ ! "${MAJOR_VER}" =~ ^v[0-9]+$ ]]; then
            echo "::error title=Invalid version::Version '${MAJOR_VER}' is not a valid major tag (expected format: v1, v2, etc.)"
            exit 1
          fi

          if [[ "${TARGET}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+-.+ ]]; then
            echo "::error title=Pre-release target::Target '${TARGET}' is a pre-release and should not update the stable major tag"
            exit 1
          fi

      - name: Config git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "226837+jonlabelle@users.noreply.github.com"

      - name: Auto-update major tag with ${{ env.TARGET }}
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          if [[ "${TARGET}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            MAJOR_VER="$(echo "${TARGET}" | cut -d. -f1)"
            git tag -f "${MAJOR_VER}" "${TARGET}"
            git push origin "${MAJOR_VER}" --force
            echo "::notice title=Major tag updated::Tagged ${TARGET} with ${MAJOR_VER}"
          else
            echo "::warning title=Invalid semver::${TARGET} is not a valid semver. Nothing to do."
            exit 1
          fi

      - name: Tag ${{ github.event.inputs.version }} -> ${{ env.TARGET }}
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          MAJOR_VER: ${{ github.event.inputs.version }}
        run: git tag -f "${MAJOR_VER}" "${TARGET}"

      - name: Push ${{ github.event.inputs.version }}
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          MAJOR_VER: ${{ github.event.inputs.version }}
        run: |
          git push origin "${MAJOR_VER}" --force
          echo "::notice title=Major tag updated::Tagged ${TARGET} with ${MAJOR_VER}"
