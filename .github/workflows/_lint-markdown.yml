name: Lint markdown

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint markdown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@main
        with:
          config: .markdownlint-cli2.jsonc
          globs: |
            "**/*.md"
            "#node_modules"
            "#CHANGELOG.md"
